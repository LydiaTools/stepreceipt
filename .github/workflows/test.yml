name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Write recorded-check summary
        run: |
          cat artifacts/demo/summary.md artifacts/rejected-write/summary.md artifacts/unknown-readback/summary.md >> "$GITHUB_STEP_SUMMARY"
          node bin/stepreceipt.mjs artifacts/demo/run.json --check
      - name: Keep synthetic reports for review
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: synthetic-browser-receipts
          path: |
            artifacts/demo/
            artifacts/rejected-write/
            artifacts/unknown-readback/
          if-no-files-found: error
          retention-days: 7
