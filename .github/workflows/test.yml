name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser-use-example:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s test -p browser_use_bridge_test.py
      - run: python -m pip install -r examples/browser-use/requirements.txt
      - run: node examples/browser-use/run.mjs --python python --chrome "$(command -v google-chrome)" --out artifacts/browser-use
      - name: Show explicit checks, including expected rejection and unknown
        run: cat artifacts/browser-use/*/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-use-native-outcome-checks
          path: |
            artifacts/browser-use/*/run.json
            artifacts/browser-use/*/report.html
            artifacts/browser-use/*/summary.md
            artifacts/browser-use/measurements.json
            artifacts/browser-use/worker.log
          if-no-files-found: error
          retention-days: 7
  langgraph-example:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r examples/langgraph/requirements.txt
      - run: node examples/langgraph/run.mjs --python python --out artifacts/langgraph
      - name: Show recorded observations, including the expected duplicate failure
        run: cat artifacts/langgraph/*/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: langgraph-process-restart
          path: artifacts/langgraph/
          if-no-files-found: error
          retention-days: 7
  agno-retry-example:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r examples/agno/requirements.txt
      - run: node examples/agno/run.mjs --python python --out artifacts/agno
      - name: Check the expected rejection
        run: |
          code=0
          node bin/stepreceipt.mjs artifacts/agno/run.json --check --summary artifacts/agno/summary.md || code=$?
          test "$code" -eq 1
          cat artifacts/agno/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: agno-synthetic-retry
          path: |
            artifacts/agno/run.json
            artifacts/agno/report.html
            artifacts/agno/observation.json
            artifacts/agno/summary.md
          if-no-files-found: error
          retention-days: 7
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:page-click
      - run: npm run demo:page-click
      - name: Check the three two-tab outcomes
        run: |
          node bin/stepreceipt.mjs artifacts/page-click/bound.json --check
          for case in ambiguous unbound; do
            code=0
            node bin/stepreceipt.mjs "artifacts/page-click/$case.json" --check || code=$?
            test "$code" -eq 1
          done
      - run: node test/langgraph-viewer.mjs
      - run: node test/browser-use-viewer.mjs
      - run: npm run test:blueprint
      - name: Write recorded-check summary
        run: |
          cat artifacts/demo/summary.md artifacts/rejected-write/summary.md artifacts/unknown-readback/summary.md >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/page-evidence/summary.md >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/blueprint/*/summary.md >> "$GITHUB_STEP_SUMMARY"
          node bin/stepreceipt.mjs artifacts/demo/run.json --check
      - name: Keep synthetic reports for review
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: synthetic-browser-receipts
          path: |
            artifacts/demo/
            artifacts/rejected-write/
            artifacts/unknown-readback/
            artifacts/page-evidence/
            artifacts/page-click/
            artifacts/screenshots/page-evidence-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Keep Blueprint integration reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-agent-blueprint-integration
          path: artifacts/blueprint/
          if-no-files-found: error
          retention-days: 7
